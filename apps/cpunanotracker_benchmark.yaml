videos:
  camera-run: ../assets/camera_run_2s_10s.mp4
  detection-demo: ../assets/detection-demo.mp4

trackers:
  CPU NanoTrack:
    element: cpunanotrack
    models-dir: ../demos/nanotracker/onnx
    metadata: nanotrack
  CPU LightTrack:
    element: cpulighttrack
    models-dir: ../demos/lighttrack/onnx
    metadata: lighttrack
  CPU LK Optical Flow:
    element: cpulktracker
    metadata: flowtrack
  CPU YOLOv8:
    kind: detector
    element: yolodetect
    model-path: ../demos/ort_cpu_demo/yolov8n.onnx
    metadata: yolo
    roi-type: yolo-detection
  CPU YOLO26n:
    kind: detector
    element: yolodetect
    model-path: ../demos/yolo26/yolo26n.onnx
    metadata: yolo
    roi-type: yolo-detection
